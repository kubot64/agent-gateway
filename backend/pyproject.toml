[project]
name = "home-secretary-backend"
version = "0.1.0"
description = "MVP backend for Slack/Discord secretary agent"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "python-multipart>=0.0.9",
  "pynacl>=1.5.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "import-linter>=2.0",
]

[tool.importlinter]
root_packages = [
  "gateway",
  "app",
  "policy",
  "tools",
  "infra",
]

[[tool.importlinter.contracts]]
name = "Layers: gateway -> app -> policy -> tools (no upward imports)"
type = "layers"
layers = [
  "gateway",
  "app",
  "policy",
  "tools",
]
