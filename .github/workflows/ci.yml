name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.110.0" \
            "uvicorn>=0.27.0" \
            "python-multipart>=0.0.9" \
            "pynacl>=1.5.0" \
            "psycopg[binary]>=3.2.0" \
            "redis>=5.0.0" \
            "import-linter>=2.0"

      - name: Check layer contracts
        working-directory: backend
        run: PYTHONPATH=src lint-imports

      - name: Run unit tests
        working-directory: backend
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v

  e2e-postgres-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docker E2E
        env:
          E2E_MODE: docker
          E2E_CLEANUP: '1'
        run: bash backend/scripts/e2e_pg_redis.sh
