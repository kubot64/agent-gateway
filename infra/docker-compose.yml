version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: home-agent-api
    restart: unless-stopped
    environment:
      DATABASE_BACKEND: postgres
      POSTGRES_DSN: postgresql://home:home@postgres:5432/home
      IDEMPOTENCY_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      DOC_SEARCH_BACKEND: hybrid
      # handle-message の直接入口。既定は無効で、ローカル開発と E2E でだけ 1 にする。
      ENABLE_DIRECT_HANDLE_MESSAGE: ${ENABLE_DIRECT_HANDLE_MESSAGE:-0}
      # Slack / Discord の入口は鍵がないと 401 を返す。使うときは実行環境から渡す。
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: home
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: home-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
