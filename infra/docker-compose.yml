version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: home
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: home-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
