display_information:
  name: home-secretary
  description: Slack / Discord secretary agent
  background_color: "#1f2937"

features:
  bot_user:
    display_name: home-secretary
    always_online: false
  slash_commands:
    - command: /ask
      description: Ask assistant
      usage_hint: /ask 質問
      should_escape: false
      url: https://REPLACE_WITH_CLOUD_RUN_URL/api/inbound/slack/commands
    - command: /summarize
      description: Summarize thread
      usage_hint: /summarize current_thread
      should_escape: false
      url: https://REPLACE_WITH_CLOUD_RUN_URL/api/inbound/slack/commands
    - command: /remind
      description: Create reminder
      usage_hint: /remind 2026-03-01T09:00 資料提出
      should_escape: false
      url: https://REPLACE_WITH_CLOUD_RUN_URL/api/inbound/slack/commands
    - command: /task
      description: Create task
      usage_hint: /task add APIの不具合を調査
      should_escape: false
      url: https://REPLACE_WITH_CLOUD_RUN_URL/api/inbound/slack/commands
    - command: /mode
      description: Set response mode
      usage_hint: /mode brief
      should_escape: false
      url: https://REPLACE_WITH_CLOUD_RUN_URL/api/inbound/slack/commands

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - commands

settings:
  event_subscriptions:
    request_url: https://REPLACE_WITH_CLOUD_RUN_URL/api/inbound/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: https://REPLACE_WITH_CLOUD_RUN_URL/api/inbound/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
